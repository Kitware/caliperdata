<section id="difference" class="py-20 md:py-28 bg-base-200">
    <div class="site-container">
        <div class="section-description">
            {% if page.difference.subheadline %}
            <p class="section-eyebrow">{{ page.difference.subheadline | escape }}</p>
            {% endif %}
            <h2 class="section-title">{{ page.difference.headline | escape }}</h2>
        </div>
        {% if page.difference.items %}
        <div class="mt-12 grid border-l border-t border-base-300 md:grid-cols-2 lg:grid-cols-3">
            {% for item in page.difference.items %}
            <article class="border-b border-r border-base-300 bg-white p-7">
                <span class="section-eyebrow text-secondary">0{{ forloop.index }}</span>
                <h3 class="mt-4 font-bold text-navy-950">{{ item.title | escape }}</h3>
                <p class="mt-3 text-sm leading-6 text-base-content/65">{{ item.text }}</p>
            </article>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</section>
